[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timepressure-agent"
version = "1.0.0"
description = "Autonomous multi-marketplace task execution engine with verified revenue, learning and safety controls."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["playwright>=1.50,<2", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
timepressure = "timepressure.cli:main"

[tool.setuptools.packages.find]
include = ["timepressure*"]
