[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timepressure-agent"
version = "0.3.0"
description = "An open-source autonomous agent runtime driven by time pressure and verified revenue."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["playwright>=1.50,<2", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
timepressure = "timepressure.cli:main"

[tool.setuptools.packages.find]
include = ["timepressure*"]
