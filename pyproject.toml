[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timepressure-agent"
version = "2.0.0"
description = "Autonomous legitimate website traffic growth engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
timepressure = "timepressure.cli:main"

[tool.setuptools.packages.find]
include = ["timepressure*"]
