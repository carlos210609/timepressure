name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install "PyJWT[crypto]>=2.10,<3" "playwright>=1.50,<2"
      - name: Lint
        run: |
          python -m pip install "ruff>=0.8,<1"
          ruff check --select E4,E7,E9,F timepressure tests timepressure.py
      - name: Compile
        run: python -m compileall timepressure timepressure.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Control plane smoke test
        run: |
          python - <<'PY'
          from timepressure.control_plane import Execution, TaskStatus, SafetyPolicy, VerifiedLedger
          e = Execution("smoke", "test", "task")
          e.transition(TaskStatus.RUNNING)
          e.transition(TaskStatus.VERIFYING)
          e.transition(TaskStatus.SUBMITTED)
          e.transition(TaskStatus.VERIFIED)
          assert e.status == "verified"
          ledger = VerifiedLedger()
          assert ledger.add_verified("smoke", 100, "test-reference") is not None
          assert ledger.add_verified("smoke", 100, "test-reference") is None
          try:
              SafetyPolicy().validate({"instruction": "bypass CAPTCHA"})
          except PermissionError:
              pass
          else:
              raise AssertionError("safety policy failed")
          PY
      - name: Dependency audit
        run: |
          python -m pip install --upgrade "setuptools>=83,<84" "pip-audit>=2.7,<3"
          pip-audit --strict
      - name: Security regression tests
        run: python -m unittest tests.test_security -v
      - name: Import application
        run: python -c "import timepressure.cli, timepressure.oauth, timepressure.agent, timepressure.web"
      - name: Dashboard smoke test
        run: |
          python - <<'PY'
          import json
          import tempfile
          from timepressure.config import load_config
          from timepressure.models import PressureState, State
          from timepressure.web import dashboard_payload
          with tempfile.TemporaryDirectory() as tmp:
              config = load_config()
              config.data_dir = tmp
              state = State(1, 0, PressureState(0, 10, 1, 10, "alive", 100))
              payload = dashboard_payload(state, config)
              assert payload["targetCents"] == 10
              assert payload["cycleRevenueCents"] == 1
              assert "access_token" not in json.dumps(payload)
          PY
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          TIMEPRESSURE_BROWSER_HEADLESS=true python - <<'PY'
          import tempfile
          from timepressure.browser import Browser
          from timepressure.models import PressureState, State
          from timepressure.store import Store
          from timepressure.config import Config

          with tempfile.TemporaryDirectory() as tmp:
              config = Config(1, 3600000, 10000, tmp, "gpt-5.6", None, "https://api.openai.com/v1", "auto", None, "nvidia/nemotron-3-super-120b-a12b", "https://integrate.api.nvidia.com/v1", True, True, True, ["example.com"], "http://127.0.0.1:9332/", None, None, None, 0.001, False, None, False)
              store = Store(tmp)
              state = store.init(1, 3600000)
              browser = Browser(config, state, store)
              try:
                  result = browser.open("https://example.com")
                  assert result["url"].startswith("https://example.com")
                  browser.page.set_content("<h1>TimePressure Browser OK</h1>")
                  snapshot = browser._snapshot()
                  assert "TimePressure Browser OK" in snapshot["text"]
              finally:
                  browser.close()
          PY
      - name: CLI smoke test
        run: |
          TIMEPRESSURE_DATA_DIR="$RUNNER_TEMP/timepressure-data" python timepressure.py --version
          TIMEPRESSURE_DATA_DIR="$RUNNER_TEMP/timepressure-data" python -m timepressure status
          TIMEPRESSURE_DATA_DIR="$RUNNER_TEMP/timepressure-data" python -m timepressure doctor
